<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recourse · Software Factory</title>
<!--
  Factory control dashboard.
  Design contract: OG-Glass preset `glassmorphic-base` (dark, quality 97/S).
  Tokens below are taken verbatim from that preset's tokens.css — do not invent
  colors off the palette (DESIGN.md section 7).
  Real-time data: GET /api/recourse/factory/state (snapshot) + /factory/stream (SSE).
  Engine + scaffold: Cheetah 4 via SIEVE. Papers: LibreOffice MCP.
-->
<style>
  :root{
    --bg:#0a0d14;
    --surface:rgba(255,255,255,.04);
    --surface-hover:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.08);
    --highlight:rgba(255,255,255,.12);
    --primary:#6366f1; --primary-hover:#474aee;
    --secondary:#e1df8d; --success:#587de3; --warning:#f0ee97; --danger:#7c5af0;
    --text:rgba(255,255,255,.92); --text-2:rgba(255,255,255,.6); --muted:rgba(255,255,255,.35);
    --blur-1:blur(8px); --blur-2:blur(16px); --blur-3:blur(28px);
    --radius:16px; --gap:16px; --pad:20px;
    --font:'DM Sans','Inter',system-ui,sans-serif; --mono:'JetBrains Mono','Fira Code',monospace;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:.9375rem;line-height:1.5;
       background-image:radial-gradient(1200px 700px at 15% -10%,rgba(99,102,241,.18),transparent 60%),
                        radial-gradient(900px 600px at 110% 10%,rgba(225,223,141,.08),transparent 55%);}
  .app{display:flex;flex-direction:column;height:100%;padding:var(--gap);gap:var(--gap)}
  header.bar{display:flex;align-items:center;gap:var(--gap);padding:12px var(--pad);
    background:var(--surface);border:1px solid var(--highlight);border-radius:var(--radius);backdrop-filter:var(--blur-2)}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:1.0625rem;font-weight:600;margin:0;letter-spacing:.2px}
  .brand small{color:var(--muted);font-family:var(--mono);font-size:.75rem}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface);
    border:1px solid var(--border);font-size:.75rem;color:var(--text-2);font-family:var(--mono)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--success);box-shadow:0 0 10px var(--success)}
  .dot.off{background:var(--danger)}
  .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,.9fr);gap:var(--gap);flex:1 1 auto;min-height:300px}
  .panel{background:var(--surface);border:1px solid var(--highlight);border-radius:var(--radius);
    backdrop-filter:var(--blur-1);box-shadow:0 8px 32px rgba(0,0,0,.4);display:flex;flex-direction:column;min-height:0}
  .panel h2{margin:0;padding:12px var(--pad);font-size:.8125rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);border-bottom:1px solid var(--border);font-weight:600}
  .canvas-wrap{position:relative;flex:1;min-height:0;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
  #scene{position:absolute;inset:0}
  .hud{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:.75rem;color:var(--text-2);
    background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:8px 10px;backdrop-filter:var(--blur-1)}
  .hud-title{font-size:.75rem;margin-bottom:6px;color:var(--text)}
  .legend{display:flex;flex-wrap:wrap;gap:8px;max-width:460px}
  .lg{display:inline-flex;align-items:center;gap:4px;font-size:.6875rem;color:var(--text-2)}
  .lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .lg.sep{margin-left:6px;padding-left:9px;border-left:1px solid var(--border)}
  .feed{overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  .ev{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:10px;background:var(--surface);
    border:1px solid var(--border);animation:in .25s ease}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .ev .t{font-family:var(--mono);font-size:.6875rem;color:var(--muted);flex:0 0 58px}
  .ev .k{font-weight:600;font-size:.75rem}
  .ev .d{color:var(--text-2);font-size:.75rem;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .k.artifact.built{color:var(--success)} .k.artifact.failed{color:var(--danger)}
  .k.idea.consumed{color:var(--warning)} .k.science.logged{color:var(--secondary)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap)}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
  .stat .l{color:var(--text-2);font-size:.75rem}
  .stat .v{font-size:1.5rem;font-weight:700;font-family:var(--mono)}
  table{width:100%;border-collapse:collapse;font-size:.8125rem}
  th{text-align:left;color:var(--text-2);font-weight:600;padding:8px var(--pad);position:sticky;top:0;background:rgba(10,13,20,.9);backdrop-filter:var(--blur-1)}
  td{padding:8px var(--pad);border-top:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:.75rem}
  tr:hover td{background:var(--surface-hover)}
  .ok{color:var(--success)} .bad{color:var(--danger)} .warn{color:var(--warning)}
  .scroll{overflow:auto;flex:1;min-height:0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);flex:0 1 auto;min-height:0;max-height:38vh}
  .muted{color:var(--muted)} .mono{font-family:var(--mono)}
  .badge{display:inline-block;padding:1px 8px;border-radius:999px;border:1px solid var(--border);font-size:.6875rem;font-family:var(--mono)}
  .offline{padding:24px;color:var(--warning);font-family:var(--mono)}

  /* Real-time reporting overhaul styles */
  .pulse{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .banner{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:8px;
    font-family:var(--mono);font-size:.8125rem;margin-bottom:8px;min-height:28px}
  .banner.working{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.45);color:#86efac}
  .banner.idle{background:rgba(240,238,151,.12);border:1px solid rgba(240,238,151,.4);color:#f5f3a3}
  .banner .state{font-weight:700;min-width:110px;letter-spacing:.05em;font-size:.75rem}
  .banner .why{flex:1;font-size:.6875rem;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .spark{display:flex;align-items:flex-end;gap:2px;height:26px;width:300px;padding:0 12px;flex-shrink:0}
  .spark i{flex:1;min-width:2px;max-width:8px;background:linear-gradient(to top,#6366f1,#22d3ee);border-radius:1px 1px 0 0;
    transition:height .3s ease;transform-origin:bottom}
  .spark i.hi{background:linear-gradient(to top,#a78bfa,#22d3ee)}

  .proc{display:grid;grid-template-columns:minmax(76px,auto) auto minmax(0,auto) minmax(0,1fr);gap:10px;align-items:center;
    padding:8px var(--pad);font-family:var(--mono);font-size:.75rem}
  .proc .nm{color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .proc .skip{color:var(--warning);font-size:.6875rem;white-space:nowrap}
  .proc .run{color:var(--success);font-size:.6875rem;white-space:nowrap}
  .proc .oc{color:var(--muted);font-size:.6875rem;white-space:nowrap}
  .proc .det{min-width:0;color:var(--muted);font-size:.6875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .feed .empty{padding:12px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:.6875rem}
  .feed-head{display:flex;align-items:center;gap:8px;padding:8px var(--pad);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.6875rem;color:var(--text-2)}
  .feed-head .count{color:var(--text);font-weight:600}
  .feed-head .age{margin-left:auto;color:var(--muted)}

  .procs-head{padding:8px var(--pad);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.6875rem;color:var(--text-2)}
  .ideas-row{padding:6px var(--pad);font-family:var(--mono);font-size:.6875rem;color:var(--text-2);border-top:1px solid var(--border);margin-top:auto}
</style>
</head>
<body>
<div id="root"><div class="offline">loading factory dashboard…</div></div>
<script src="/api/recourse/factory/dashboard.js" defer></script>
</body>
</html>
