# Recourse — one-command local deploy.
#   docker compose up --build
# Generation uses the configured OpenAI-compatible provider. Set MODEL_BASE_URL
# in .env (or the shell) to point at a reachable endpoint. For a model server
# running on the host (e.g. llama-server on :11434), use
# MODEL_BASE_URL="http://host.docker.internal:11434/v1".
services:
  recourse:
    build: .
    image: recourse:local
    ports:
      - "3050:3050"
    env_file:
      - .env
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.pgsgrove.com/v1}
      PORT: "3050"
    volumes:
      - recourse-data:/app/data
      - recourse-selfhosted:/app/.selfhosted
    restart: unless-stopped

volumes:
  recourse-data:
  recourse-selfhosted:
