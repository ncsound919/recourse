name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (client + server bundle)
        run: npm run build
      # Coverage gates run only on the primary Node version to save CI time; the
      # thresholds live in vitest.config.ts (80/80/80/60).
      - name: Coverage (gated)
        if: matrix.node-version == 20
        run: npm run test:coverage
