name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (oxlint)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (client + server bundle)
        run: npm run build
      # Coverage gates run only on the primary Node version to save CI time; the
      # thresholds live in vitest.config.ts (80/80/80/60).
      - name: Coverage (gated)
        if: matrix.node-version == 20
        run: npm run test:coverage

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      # Build only (never push). Layer cache keeps rebuilds fast and stable.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recourse:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boot the image and require a real 200 from the open status route.
      - name: Run container and health-check
        run: |
          docker run -d --name recourse-smoke -p 3050:3050 recourse:smoke
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3050/api/recourse/status > /tmp/status.json; then
              echo "healthy after ${i}s"; cat /tmp/status.json; exit 0
            fi
            sleep 1
          done
          echo "::error::container did not become healthy within 90s"
          docker logs recourse-smoke
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f recourse-smoke || true
