# Dependabot — keep dependencies and CI actions current (and surface advisories).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Batch routine upgrades so PR noise stays low.
      dev-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
    ignore:
      # Major upgrades are reviewed deliberately, not auto-opened.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
