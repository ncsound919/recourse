name = "kg-sidecar"
main = "cf-worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "Kg"
image = "./Dockerfile"
max_instances = 2

[[durable_objects.bindings]]
name = "KG"
class_name = "Kg"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Kg"]
